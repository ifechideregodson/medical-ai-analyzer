version: "3.9"

services:
  api:
    build: .
    container_name: medical-ai-api-dev
    environment:
      ENV: development
      DEBUG: "True"
      DATABASE_URL: postgresql://medical_ai:secure_password_change_me@postgres:5432/medical_ai
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medical_ai
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: medical_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit.dev
    container_name: medical-ai-ui-dev
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  postgres_data:
