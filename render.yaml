services:
  # PostgreSQL Database Service
  - type: pserv
    name: medical-ai-postgres
    runtime: postgresql
    plan: free
    region: oregon
    ipAllowList: []
    databaseName: medical_ai
    user: medical_ai_user
    preDeployCommand: ""
    postDeployCommand: ""
    environmentSlug: postgres
    envVars:
      - key: POSTGRES_PASSWORD
        generateValue: true

  # Redis Cache Service
  - type: redis
    name: medical-ai-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # FastAPI Web Service
  - type: web
    name: medical-ai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    healthCheckInterval: 30
    autoDeploy: true
    maxInstances: 1
    
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: medical-ai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medical-ai-redis
          type: redis
          property: connectionString
      - key: API_TITLE
        value: Medical AI Analyzer
      - key: API_VERSION
        value: 1.0.0
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: REVIEW_THRESHOLD
        value: "0.75"
      - key: LOG_LEVEL
        value: INFO
      - key: XRAY_MODEL_PATH
        value: models/xray_model.pth
      - key: SKIN_MODEL_PATH
        value: models/skin_model.pth
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://medical-ai-api.onrender.com,http://localhost:3000,http://localhost:8501

    routes:
      - path: /
        matchType: prefix
