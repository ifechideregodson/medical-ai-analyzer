services:
  - type: redis
    name: medical-ai-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: medical-ai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: python -m gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Use the PostgreSQL database already configured in Render.
      # Set DATABASE_URL manually in the Render service environment.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: medical-ai-redis
          type: redis
          property: connectionString
      - key: API_TITLE
        value: Medical AI Analyzer
      - key: API_VERSION
        value: 1.0.0
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: REVIEW_THRESHOLD
        value: "0.75"
      - key: LOG_LEVEL
        value: INFO
      - key: API_KEY_ADMIN_SECRET
        generateValue: true
      - key: MODEL_GATEWAY_KEY_PREFIX
        value: medai_gw
      - key: XRAY_MODEL_PATH
        value: models/xray_model.pth
      - key: SKIN_MODEL_PATH
        value: models/skin_model.pth
      - key: XRAY_MODEL_URL
        value: https://github.com/ifechideregodson/medical-ai-analyzer/releases/latest/download/pneumonia-model.pth
      - key: SKIN_MODEL_URL
        value: https://github.com/ifechideregodson/medical-ai-analyzer/releases/latest/download/skin-model.pth
      - key: XRAY_MODEL_LABELS
        value: '["normal", "pneumonia"]'
      - key: SKIN_MODEL_LABELS
        value: '["actinic keratoses", "basal cell carcinoma", "benign keratosis-like lesions", "dermatofibroma", "melanoma", "melanocytic nevi", "vascular lesions"]'
      - key: MODEL_DOWNLOAD_TIMEOUT
        value: "300"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://medical-ai-api.onrender.com,https://medical-ai-web.onrender.com,http://localhost:3000,http://localhost:8501

  - type: web
    name: medical-ai-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://medical-ai-api.onrender.com
      # Server-side API key used by the Next.js analyze proxy. Set this in Render.
      - key: MEDAI_WEB_API_KEY
        sync: false
      - key: MEDAI_API_URL
        value: https://medical-ai-api.onrender.com
