services:
  - type: pserv
    name: medical-ai-postgres
    runtime: postgresql
    plan: free
    region: oregon
    ipAllowList: []
    databaseName: medical_ai
    user: medical_ai_user
    preDeployCommand: ""
    postDeployCommand: ""
    environmentSlug: postgres
    envVars:
      - key: POSTGRES_PASSWORD
        generateValue: true

  - type: redis
    name: medical-ai-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: medical-ai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    healthCheckInterval: 30
    autoDeploy: true
    maxInstances: 1
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: medical-ai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medical-ai-redis
          type: redis
          property: connectionString
      - key: API_TITLE
        value: Medical AI Analyzer
      - key: API_VERSION
        value: 1.0.0
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: REVIEW_THRESHOLD
        value: "0.75"
      - key: LOG_LEVEL
        value: INFO
      - key: XRAY_MODEL_PATH
        value: models/xray_model.pth
      - key: SKIN_MODEL_PATH
        value: models/skin_model.pth
      - key: XRAY_MODEL_URL
        value: https://github.com/ifechideregodson/medical-ai-analyzer/releases/latest/download/pneumonia-model.pth
      - key: SKIN_MODEL_URL
        value: https://github.com/ifechideregodson/medical-ai-analyzer/releases/latest/download/skin-model.pth
      - key: XRAY_MODEL_LABELS
        value: '["normal", "pneumonia"]'
      - key: SKIN_MODEL_LABELS
        value: '["actinic keratoses", "basal cell carcinoma", "benign keratosis-like lesions", "dermatofibroma", "melanoma", "melanocytic nevi", "vascular lesions"]'
      - key: MODEL_DOWNLOAD_TIMEOUT
        value: "300"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://medical-ai-api.onrender.com,https://medical-ai-web.onrender.com,http://localhost:3000,http://localhost:8501

  - type: web
    name: medical-ai-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://medical-ai-api.onrender.com
