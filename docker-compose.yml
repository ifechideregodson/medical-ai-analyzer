version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: medical-ai-postgres
    environment:
      POSTGRES_USER: medical_ai
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: medical_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: medical-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build: .
    container_name: medical-ai-api
    environment:
      ENV: production
      DATABASE_URL: postgresql://medical_ai:secure_password_change_me@postgres:5432/medical_ai
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped

  # Streamlit UI
  streamlit:
    image: python:3.11-slim
    container_name: medical-ai-ui
    working_dir: /app
    command: bash -c "pip install streamlit requests pillow && streamlit run app/ui/streamlit_app.py --server.port=8501"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  # MLflow Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: medical-ai-mlflow
    working_dir: /mlflow
    command: bash -c "pip install mlflow psycopg2-binary && mlflow server --backend-store-uri postgresql://medical_ai:secure_password_change_me@postgres:5432/mlflow --default-artifact-root /mlflow/artifacts --host 0.0.0.0"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: medical-ai-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: medical-ai-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: medical-ai-network
