name: MedAI gateway contract tests

on:
  push:
    branches:
      - feat/medai-clinical-gateway
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
      - name: Run gateway contract tests
        env:
          MEDAI_WEB_API_KEY: ci-test-secret
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_medai_gateway.py
